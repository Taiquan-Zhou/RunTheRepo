services:
  web:
    image: busybox:1.36.1@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
    user: "65534:65534"
    read_only: true
    cap_drop:
      - ALL
    command:
      - httpd
      - -f
      - -p
      - "8080"
      - -h
      - /www
    ports:
      - "127.0.0.1:8080:8080"
    configs:
      - source: marker
        target: /www/marker.txt
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - "-"
        - http://127.0.0.1:8080/marker.txt
      interval: 1s
      timeout: 1s
      retries: 20

configs:
  marker:
    file: ./marker.txt
