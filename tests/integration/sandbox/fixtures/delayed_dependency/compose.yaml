services:
  db:
    image: busybox:1.36.1@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
    command:
      - sh
      - -c
      - sleep 70; exec httpd -f -p 8081 -h /www
    configs:
      - source: health-marker
        target: /www/health.txt
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - "-"
        - http://127.0.0.1:8081/health.txt
      interval: 2s
      timeout: 1s
      start_period: 90s
      retries: 5

  web:
    image: busybox:1.36.1@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
    depends_on:
      db:
        condition: service_healthy
    command:
      - httpd
      - -f
      - -p
      - "8080"
      - -h
      - /www
    configs:
      - source: health-marker
        target: /www/health.txt
    ports:
      - "8080:8080"
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - "-"
        - http://127.0.0.1:8080/health.txt
      interval: 2s
      timeout: 1s
      retries: 5

configs:
  health-marker:
    file: ./www/health.txt
