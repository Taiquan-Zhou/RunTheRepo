services:
  web:
    image: busybox:1.36.1@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
    command: [httpd, -f, -p, "8080", -h, /www]
    volumes:
      - ./www:/www:ro
    healthcheck:
      test: [CMD, wget, -q, -O, -, http://127.0.0.1:8080/health.txt]
      interval: 1s
      timeout: 2s
      retries: 30
      start_period: 1s
