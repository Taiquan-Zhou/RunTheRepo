version: 1
freeze_date: "2026-08-29"
cohort_policy:
  status: frozen_before_execution
  deterministic_order: repositories_list_order
  replacement_policy: >-
    Retain all ten repositories and their order. No repository may be removed,
    replaced, or reordered based on a pilot attempt or result.
  admission_criteria:
    - Public and cloneable repository.
    - Full lowercase 40-character commit SHA pinned from the default branch.
    - Compose file exists at the pinned commit.
    - Basic startup documentation exists in the same pinned repository.
    - >-
      Basic local startup does not require paid SaaS, private credentials,
      external OAuth, GPU, or a large database cluster; optional integrations
      do not disqualify a repository.
  selection_policy:
    anti_cherry_picking: >-
      The cohort and order are frozen before execution. Failures remain in the
      denominator, and no repository is dropped or replaced after results are
      observed.
    diversity:
      - Root and nested Compose layouts.
      - Image-pull, source-build, and deployment-repository forms.
      - Single-service and multi-service stacks.
      - Relational database, cache, worker, volume, and health-check patterns.
      - Compose override and environment-template setup patterns.
      - Outbound-network behavior.
      - One Docker-socket workload retained to stress isolation policy.

repositories:
  - id: umami
    url: https://github.com/umami-software/umami
    commit_sha: ca661c7057984aa98ed4f7083d84dae2f65bfcb0
    selection_rationale: >-
      Adds a root-Compose analytics application with a relational database,
      health checks, and persistent storage.
    expected_entry:
      service: umami
      container_port: 3000
      documented_host_port: 3000
    compose:
      path: docker-compose.yml
      evidence: https://github.com/umami-software/umami/blob/ca661c7057984aa98ed4f7083d84dae2f65bfcb0/docker-compose.yml
    startup_documentation:
      path: README.md
      section: Docker Compose, lines 72-86
      evidence: https://github.com/umami-software/umami/blob/ca661c7057984aa98ed4f7083d84dae2f65bfcb0/README.md#L72-L86
    workload_shape:
      - Analytics web application
      - PostgreSQL
      - Health checks
      - Persistent database volume
    documented_setup:
      - instruction: Follow the pinned README Docker Compose procedure.

