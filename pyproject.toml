[project]
name = "repotrial"
version = "0.1.0"
description = "Reproducible deployment trials for untrusted Docker Compose web applications."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27,<1",
    "langgraph>=1.2,<2",
    "playwright>=1.52,<2",
    "pydantic>=2",
    "ruamel-yaml>=0.19,<0.20",
    "typer>=0.12.0",
]

[project.scripts]
repotrial = "repotrial.cli:app"
repotrial-eval = "repotrial.eval.cli:app"

[dependency-groups]
dev = [
    "fastapi>=0.115.0",
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "uvicorn>=0.32.0",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = [
    "/src/**/*.py",
    "/tests/**/*.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["repotrial"]

[tool.coverage.report]
fail_under = 85

[tool.ruff]
extend-exclude = ["docs/superpowers/plans/2026-08-25-repotrial-mvp.md"]
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
