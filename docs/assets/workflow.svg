<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">RunTheRepo workflow</title><desc id="desc">Two-row evidence-first workflow from a pinned source to forced cleanup.</desc>
<style>
.canvas{fill:#f8fafc}.eyebrow{fill:#2563eb;font:700 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:1.8px}.heading{fill:#0f172a;font:700 30px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.subheading{fill:#475569;font:400 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.card{fill:#fff;stroke:#cbd5e1;stroke-width:2}.accent{fill:#eff6ff;stroke:#93c5fd}.num{fill:#2563eb;font:700 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.label{fill:#0f172a;font:700 17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.detail{fill:#475569;font:400 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.line{stroke:#64748b;stroke-width:3;stroke-linecap:round}.arrow{fill:#64748b}.foot{fill:#64748b;font:400 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
@media(prefers-color-scheme:dark){.canvas{fill:#0b1220}.eyebrow{fill:#93c5fd}.heading{fill:#f8fafc}.subheading{fill:#cbd5e1}.card{fill:#111827;stroke:#334155}.accent{fill:#172554;stroke:#3b82f6}.num{fill:#93c5fd}.label{fill:#f8fafc}.detail{fill:#cbd5e1}.line{stroke:#94a3b8}.arrow{fill:#94a3b8}.foot{fill:#94a3b8}}
</style>
<rect class="canvas" width="1200" height="560" rx="24"/>
<text class="eyebrow" x="48" y="48">RUN THE REPO · EVIDENCE-FIRST TRIALS</text><text class="heading" x="48" y="88">From pinned source to auditable result</text><text class="subheading" x="48" y="116">Each change is replayed against the recorded baseline before it is kept.</text>
<path class="line" d="M290 205h36M580 205h36M870 205h36M1035 270v60M910 435h-36M620 435h-36M330 435h-36"/><path class="arrow" d="m326 205-10-7v14zM616 205l-10-7v14zM906 205l-10-7v14zM1035 330l-7-10h14zM874 435l10-7v14zM584 435l10-7v14zM294 435l10-7v14z"/>
<g transform="translate(40 150)"><rect class="card accent" width="250" height="120" rx="16"/><text class="num" x="20" y="30">01</text><text class="label" x="20" y="62">Pin the source</text><text class="detail" x="20" y="88">GitHub URL + exact commit</text><text class="detail" x="20" y="107">reproducible input</text></g>
<g transform="translate(330 150)"><rect class="card" width="250" height="120" rx="16"/><text class="num" x="20" y="30">02</text><text class="label" x="20" y="62">Create isolation</text><text class="detail" x="20" y="88">Disposable sandbox</text><text class="detail" x="20" y="107">no host Docker fallback</text></g>
<g transform="translate(620 150)"><rect class="card" width="250" height="120" rx="16"/><text class="num" x="20" y="30">03</text><text class="label" x="20" y="62">Boot the app</text><text class="detail" x="20" y="88">Docker Compose startup</text><text class="detail" x="20" y="107">recorded as evidence</text></g>
<g transform="translate(910 150)"><rect class="card" width="250" height="120" rx="16"/><text class="num" x="20" y="30">04</text><text class="label" x="20" y="62">Verify workflows</text><text class="detail" x="20" y="88">Deterministic HTTP checks</text><text class="detail" x="20" y="107">record the baseline</text></g>
<g transform="translate(910 375)"><rect class="card accent" width="250" height="120" rx="16"/><text class="num" x="20" y="30">05</text><text class="label" x="20" y="62">Test hardening</text><text class="detail" x="20" y="88">Apply → boot → replay</text><text class="detail" x="20" y="107">verify every mutation</text></g>
<g transform="translate(620 375)"><rect class="card" width="250" height="120" rx="16"/><text class="num" x="20" y="30">06</text><text class="label" x="20" y="62">Keep or roll back</text><text class="detail" x="20" y="88">Keep only passing changes</text><text class="detail" x="20" y="107">preserve provenance</text></g>
<g transform="translate(330 375)"><rect class="card" width="250" height="120" rx="16"/><text class="num" x="20" y="30">07</text><text class="label" x="20" y="62">Publish evidence</text><text class="detail" x="20" y="88">JSON + HTML report</text><text class="detail" x="20" y="107">run IDs and references</text></g>
<g transform="translate(40 375)"><rect class="card" width="250" height="120" rx="16"/><text class="num" x="20" y="30">08</text><text class="label" x="20" y="62">Force cleanup</text><text class="detail" x="20" y="88">Remove sandbox and template</text><text class="detail" x="20" y="107">cleanup failure stays failed</text></g>
<text class="foot" x="48" y="535">Tested-journey / workload-conditioned hardened candidate — never a universal safety certification.</text>
</svg>
