<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">RunTheRepo workflow</title>
<desc id="desc">Two-row evidence-first workflow. Cards and connectors light cumulatively from 01 through 08, then remain lit.</desc>
<style>
.canvas{fill:#f8fafc}.eyebrow{fill:#2563eb;font:700 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:1.8px}.heading{fill:#0f172a;font:700 30px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.subheading{fill:#475569;font:400 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.card{fill:#fff;stroke:#cbd5e1;stroke-width:2}.glow{fill:#eff6ff;stroke:#3b82f6;stroke-width:2}.num{fill:#2563eb;font:700 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.label{fill:#0f172a;font:700 17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.detail{fill:#475569;font:400 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.line{stroke:#64748b;stroke-width:3;stroke-linecap:round}.arrow{fill:#64748b}.foot{fill:#64748b;font:400 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.step{--delay:0s;opacity:.5;animation:step-rise .75s ease-out var(--delay) both}.glow{opacity:0;animation:glow-rise .75s ease-out var(--delay) both}.flow{opacity:.28;animation:flow-rise .45s ease-out var(--delay) both}
.step-01{--delay:0s}.step-02{--delay:1.4s}.step-03{--delay:2.8s}.step-04{--delay:4.2s}.step-05{--delay:5.6s}.step-06{--delay:7s}.step-07{--delay:8.4s}.step-08{--delay:9.8s}
.flow-01{--delay:.9s}.flow-02{--delay:2.3s}.flow-03{--delay:3.7s}.flow-04{--delay:5.1s}.flow-05{--delay:6.5s}.flow-06{--delay:7.9s}.flow-07{--delay:9.3s}
@keyframes step-rise{from{opacity:.5}to{opacity:1}}@keyframes glow-rise{from{opacity:0}to{opacity:.94}}@keyframes flow-rise{from{opacity:.28}to{opacity:1}}
@media(prefers-color-scheme:dark){.canvas{fill:#0b1220}.eyebrow{fill:#93c5fd}.heading{fill:#f8fafc}.subheading{fill:#cbd5e1}.card{fill:#111827;stroke:#334155}.glow{fill:#172554;stroke:#60a5fa}.num{fill:#93c5fd}.label{fill:#f8fafc}.detail{fill:#cbd5e1}.line{stroke:#94a3b8}.arrow{fill:#94a3b8}.foot{fill:#94a3b8}}
@media(prefers-reduced-motion:reduce){.step,.glow,.flow{animation:none}.step{opacity:1}.glow{opacity:.94}.flow{opacity:1}}
</style>
<rect class="canvas" width="1200" height="560" rx="24"/>
<text class="eyebrow" x="48" y="48">RUN THE REPO · EVIDENCE-FIRST TRIALS</text><text class="heading" x="48" y="88">From pinned source to auditable result</text><text class="subheading" x="48" y="116">Each change is replayed against the recorded baseline before it is kept.</text>
<path class="line flow flow-01" d="M290 205h36"/><path class="line flow flow-02" d="M580 205h36"/><path class="line flow flow-03" d="M870 205h36"/><path class="line flow flow-04" d="M1035 270v95"/><path class="line flow flow-05" d="M910 435h-36"/><path class="line flow flow-06" d="M620 435h-36"/><path class="line flow flow-07" d="M330 435h-36"/>
<path class="arrow flow flow-01" d="m326 205-10-7v14z"/><path class="arrow flow flow-02" d="m616 205-10-7v14z"/><path class="arrow flow flow-03" d="m906 205-10-7v14z"/><path class="arrow flow flow-04" d="m1035 365-7-10h14z"/><path class="arrow flow flow-05" d="m874 435 10-7v14z"/><path class="arrow flow flow-06" d="m584 435 10-7v14z"/><path class="arrow flow flow-07" d="m294 435 10-7v14z"/>
<g class="step step-01" transform="translate(40 150)"><rect class="card" width="250" height="120" rx="16"/><rect class="glow" width="250" height="120" rx="16"/><text class="num" x="20" y="30">01</text><text class="label" x="20" y="62">Pin the source</text><text class="detail" x="20" y="88">GitHub URL + exact commit</text><text class="detail" x="20" y="107">reproducible input</text></g>
<g class="step step-02" transform="translate(330 150)"><rect class="card" width="250" height="120" rx="16"/><rect class="glow" width="250" height="120" rx="16"/><text class="num" x="20" y="30">02</text><text class="label" x="20" y="62">Create isolation</text><text class="detail" x="20" y="88">Disposable sandbox</text><text class="detail" x="20" y="107">no host Docker fallback</text></g>
<g class="step step-03" transform="translate(620 150)"><rect class="card" width="250" height="120" rx="16"/><rect class="glow" width="250" height="120" rx="16"/><text class="num" x="20" y="30">03</text><text class="label" x="20" y="62">Boot the app</text><text class="detail" x="20" y="88">Docker Compose startup</text><text class="detail" x="20" y="107">recorded as evidence</text></g>
<g class="step step-04" transform="translate(910 150)"><rect class="card" width="250" height="120" rx="16"/><rect class="glow" width="250" height="120" rx="16"/><text class="num" x="20" y="30">04</text><text class="label" x="20" y="62">Verify workflows</text><text class="detail" x="20" y="88">Deterministic HTTP checks</text><text class="detail" x="20" y="107">record the baseline</text></g>
<g class="step step-05" transform="translate(910 375)"><rect class="card" width="250" height="120" rx="16"/><rect class="glow" width="250" height="120" rx="16"/><text class="num" x="20" y="30">05</text><text class="label" x="20" y="62">Test hardening</text><text class="detail" x="20" y="88">Apply → boot → replay</text><text class="detail" x="20" y="107">verify every mutation</text></g>
<g class="step step-06" transform="translate(620 375)"><rect class="card" width="250" height="120" rx="16"/><rect class="glow" width="250" height="120" rx="16"/><text class="num" x="20" y="30">06</text><text class="label" x="20" y="62">Keep or roll back</text><text class="detail" x="20" y="88">Keep only passing changes</text><text class="detail" x="20" y="107">preserve provenance</text></g>
<g class="step step-07" transform="translate(330 375)"><rect class="card" width="250" height="120" rx="16"/><rect class="glow" width="250" height="120" rx="16"/><text class="num" x="20" y="30">07</text><text class="label" x="20" y="62">Publish evidence</text><text class="detail" x="20" y="88">JSON + HTML report</text><text class="detail" x="20" y="107">run IDs and references</text></g>
<g class="step step-08" transform="translate(40 375)"><rect class="card" width="250" height="120" rx="16"/><rect class="glow" width="250" height="120" rx="16"/><text class="num" x="20" y="30">08</text><text class="label" x="20" y="62">Force cleanup</text><text class="detail" x="20" y="88">Remove sandbox and template</text><text class="detail" x="20" y="107">cleanup failure stays failed</text></g>
<text class="foot" x="48" y="535">Tested-journey / workload-conditioned hardened candidate — never a universal safety certification.</text>
</svg>
